<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Adaptive-icon foreground: keep everything inside the 66-unit safe circle around (54,54). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D48A"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C65C"/>
      <stop offset="1" stop-color="#E39B2D"/>
    </linearGradient>
  </defs>

  <g transform="translate(54 54) scale(0.9) translate(-54 -54)">
  <!-- Hourglass -->
  <g>
    <!-- glass -->
    <path d="M41.5 30.5 H66.5 C66.5 40 60 45.5 56.2 48.6 Q54 50.4 56.2 52.2 C60 55.3 66.5 61 66.5 70 H41.5 C41.5 61 48 55.3 51.8 52.2 Q54 50.4 51.8 48.6 C48 45.5 41.5 40 41.5 30.5 Z"
          fill="#D8ECF7" fill-opacity="0.28" stroke="#EAF5FB" stroke-opacity="0.75" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- sand in the top bulb -->
    <path d="M45.2 37.5 H62.8 C61.4 41.6 58 44.8 55.4 47 Q54 48.2 52.6 47 C50 44.8 46.6 41.6 45.2 37.5 Z" fill="url(#sand)"/>
    <!-- falling stream -->
    <rect x="53.35" y="48" width="1.3" height="12" rx="0.65" fill="#F2B544"/>
    <!-- side posts -->
    <rect x="37.6" y="28" width="2.6" height="45" rx="1.3" fill="url(#gold)"/>
    <rect x="67.8" y="28" width="2.6" height="45" rx="1.3" fill="url(#gold)"/>
    <!-- caps -->
    <rect x="35" y="25.2" width="38" height="5.4" rx="2.7" fill="url(#gold)"/>
  </g>

  <!-- Open book in front -->
  <g>
    <!-- cover -->
    <path d="M30 63.5 Q42 60 54 65 Q66 60 78 63.5 L78 81.5 Q66 78.5 54 84 Q42 78.5 30 81.5 Z" fill="#9E3226"/>
    <!-- pages -->
    <path d="M32.5 60.2 Q43.5 56.6 53.2 62 L53.2 80.6 Q43.5 75.6 32.5 78.4 Z" fill="#FBF4E2"/>
    <path d="M75.5 60.2 Q64.5 56.6 54.8 62 L54.8 80.6 Q64.5 75.6 75.5 78.4 Z" fill="#F3E8CC"/>
    <!-- spine shadow -->
    <path d="M53.2 62 Q54 61.4 54.8 62 L54.8 80.6 Q54 80.1 53.2 80.6 Z" fill="#D9C7A0"/>
    <!-- lines of text -->
    <g stroke="#B9A780" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M36 64.4 Q43 62.3 49.8 65.2"/>
      <path d="M36 68.4 Q43 66.3 49.8 69.2"/>
      <path d="M36 72.4 Q41 70.9 45.5 72.6"/>
      <path d="M72 64.4 Q65 62.3 58.2 65.2"/>
      <path d="M72 68.4 Q65 66.3 58.2 69.2"/>
      <path d="M72 72.4 Q67 70.9 62.5 72.6"/>
    </g>
  </g>
  </g>
</svg>
